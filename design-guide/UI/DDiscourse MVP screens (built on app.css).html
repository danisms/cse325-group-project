<style>
:root{--bg:#F1F5F9;--fg:#0B1F3A;--mu:#64748B;--sf:#fff;--bd:#E2E8F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--fg:#E2E8F0;--mu:#94A3B8;--sf:#111B2E;--bd:#22304A}}
:root[data-theme="dark"]{--bg:#0B1220;--fg:#E2E8F0;--mu:#94A3B8;--sf:#111B2E;--bd:#22304A}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 Inter,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar h1{font:700 15px Inter;margin:0;display:flex;align-items:center;gap:8px}.bar h1 img{height:24px}
.grp{display:flex;gap:6px;overflow-x:auto;padding:2px;max-width:100%}
.grp button{border:1px solid var(--bd);background:var(--sf);color:var(--fg);border-radius:99px;padding:6px 12px;font:500 13px Inter;white-space:nowrap;min-height:36px;cursor:pointer}
.grp button[aria-pressed=true]{background:#2563EB;color:#fff;border-color:#2563EB}
.note,.cap{max-width:1100px;margin:14px auto 0;padding:0 16px;color:var(--mu);font-size:14px}.note b,.cap b{color:var(--fg)}
#stage{padding:12px 16px 32px;display:flex;flex-direction:column;align-items:center}
.dev{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff}.dev.m{border:8px solid #0B1F3A;border-radius:34px}
iframe{display:block;border:0;width:100%}
.spec{max-width:1100px;margin:0 auto;padding:0 16px 48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.spec div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;font-size:14px}
.spec h2{font:600 15px Inter;margin:0 0 6px}.spec p{margin:0;color:var(--mu)}

<script type="text/plain" id="css">/* ==========================================================================
   Discourse MVP: app.css
   One stylesheet, no component library. Tokens come from the brand guide.
   Remove Bootstrap from the Blazor template so it doesn't compete with this.
   Desktop = sidebar. Mobile = top bar + bottom tab bar (one @media rule at the end).
   ========================================================================== */

:root {
  /* Brand */
  --color-primary: #2563EB;
  --color-primary-hover: #1D4ED8;
  --color-primary-light: #EFF6FF;
  --color-navy: #0B1F3A;

  /* Actions */
  --color-success: #15803D;
  --color-success-hover: #166534;
  --color-danger: #B91C1C;
  --color-danger-light: #FEF2F2;
  --color-danger-border: #FECACA;

  /* Surfaces */
  --color-background: #F1F5F9;
  --color-surface: #FFFFFF;
  --color-border: #E2E8F0;
  --color-input-border: #94A3B8;

  /* Text */
  --color-text: #0B1F3A;
  --color-text-muted: #64748B;

  /* Type + shape */
  --font-family: "Inter", system-ui, sans-serif;
  --font-size-body: 16px;
  --line-height-body: 1.7;
  --radius-card: 12px;
  --radius-button: 8px;
}

/* Board colours: add class c0..c5 to an element. Use  c@(board.Id % 6)  in Razor.
   --band = decorative stripe, --tint/--ink = tag pill, --ink also = avatar fill. */
.c0 { --band: #2563EB; --tint: #DBEAFE; --ink: #1E40AF; }
.c1 { --band: #0D9488; --tint: #CCFBF1; --ink: #115E59; }
.c2 { --band: #7C3AED; --tint: #EDE9FE; --ink: #5B21B6; }
.c3 { --band: #D97706; --tint: #FEF3C7; --ink: #92400E; }
.c4 { --band: #E11D48; --tint: #FFE4E6; --ink: #9F1239; }
.c5 { --band: #0891B2; --tint: #CFFAFE; --ink: #155E75; }

/* ==BASE-START== */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-family);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  color: var(--color-text);
  background: var(--color-background);
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
/* ==BASE-END== */

/* ---------- Layout shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; padding: 28px; }
.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-wide { max-width: 960px; }
.page-narrow { max-width: 720px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 30px; line-height: 1.2; font-weight: 700; }
.spacer { margin-left: auto; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--color-text-muted); font-size: 13px; }

/* Sidebar (desktop) */
.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
  padding: 20px 14px;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
}
.brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 16px; font-size: 20px; font-weight: 700; }
.brand img { height: 28px; width: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  min-height: 44px; padding: 10px 12px; border-radius: var(--radius-button);
  font-size: 14px; font-weight: 500; color: #334155;
}
.nav-item:hover { background: var(--color-background); }
.nav-item.active { background: var(--color-primary-light); color: var(--color-primary); }
.sidebar > .btn { margin-top: 12px; }
.sidebar-user { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 8px; }
.user-chip { display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.3; font-weight: 600; }
.user-chip small { display: block; font-weight: 400; font-size: 13px; color: var(--color-text-muted); }

/* Mobile chrome: hidden on desktop, shown in the @media block */
.topbar-m { display: none; align-items: center; gap: 10px; padding: 10px 16px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); position: sticky; top: 0; z-index: 5; }
.topbar-m .brand { padding: 0; font-size: 18px; }
.topbar-m .brand img { height: 26px; }
.tabbar {
  display: none; grid-template-columns: repeat(4, 1fr);
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--color-surface); border-top: 1px solid var(--color-border);
  padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px));
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; font-weight: 500; color: var(--color-text-muted); }
.tab.active { color: var(--color-primary); }
.tab-fab { display: grid; place-items: center; width: 44px; height: 44px; margin-top: -4px; border-radius: 50%; background: var(--color-primary); color: #fff; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 9px 16px;
  border: 1px solid transparent; border-radius: var(--radius-button);
  background: var(--color-primary); color: #fff;
  font-size: 14px; font-weight: 600; line-height: 1.2;
}
.btn:hover { background: var(--color-primary-hover); }
.btn-green { background: var(--color-success); }              /* Publish / confirmations only */
.btn-green:hover { background: var(--color-success-hover); }
.btn-outline { background: #fff; color: var(--color-text); border-color: #CBD5E1; }
.btn-outline:hover { background: var(--color-background); }
.btn-danger { background: var(--color-danger); }
.btn-danger:hover { background: #991B1B; }
.btn-light { background: #fff; color: var(--color-navy); }
.btn-light:hover { background: #E2E8F0; }
.btn-outline-light { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .55); }
.btn-outline-light:hover { background: rgba(255, 255, 255, .12); }
.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 6px 14px; }
.link-btn { background: none; border: 0; padding: 6px 0; font-size: 13px; font-weight: 500; color: var(--color-primary); }
.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--color-danger); }

/* ---------- Cards, tags, avatars ---------- */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-card); }
.card-pad { padding: 20px; }
.tag { display: inline-block; padding: 5px 10px; border-radius: 99px; background: var(--tint, #DBEAFE); color: var(--ink, #1E40AF); font-size: 12px; font-weight: 600; line-height: 1; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 99px; background: var(--color-primary-light); color: #1E40AF; font-size: 11px; font-weight: 600; line-height: 1.3; }
.avatar { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ink, var(--color-navy)); color: #fff; font-size: 11px; font-weight: 600; }
.avatar-lg { width: 36px; height: 36px; font-size: 13px; }

/* ---------- Article card (used on Home and Board page) ---------- */
.article-card { display: block; padding: 16px 18px; border-left: 4px solid var(--band, var(--color-primary)); }
.article-card:hover { border-color: #CBD5E1; border-left-color: var(--band); }
.article-card:hover h3 { color: var(--color-primary); }
.article-card h3 { margin: 8px 0 4px; font-size: 18px; line-height: 1.35; font-weight: 600; }
.article-card .excerpt { color: var(--color-text-muted); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--color-text-muted); }
.meta b { font-weight: 500; color: var(--color-text); }
.meta .count { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }

/* ---------- Board card + board header ---------- */
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.board-card { display: block; overflow: hidden; }
.board-card:hover { border-color: #CBD5E1; }
.board-card .band { height: 56px; background: var(--band); }
.board-card .body { padding: 14px 16px 16px; }
.board-card h3 { font-size: 17px; font-weight: 600; }
.board-head { overflow: hidden; }
.board-head .band { height: 72px; background: var(--band); }
.board-head .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; }
.board-head h1 { font-size: 28px; line-height: 1.2; font-weight: 700; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; }
.input {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--color-input-border); border-radius: var(--radius-button);
  background: #fff; color: var(--color-text); font-size: 15px;
}
.input:focus { outline: 2px solid var(--color-primary); outline-offset: 0; border-color: var(--color-primary); }
textarea.input { min-height: 320px; line-height: 1.7; resize: vertical; }
textarea.input.input-sm { min-height: 88px; }
.input-title { border: 0; border-bottom: 1px solid var(--color-border); border-radius: 0; padding: 4px 0 12px; font-size: 28px; font-weight: 700; line-height: 1.25; }
.input-title:focus { outline: none; border-bottom-color: var(--color-primary); }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); pointer-events: none; }
.search .input { padding-left: 38px; }
.filters { display: grid; grid-template-columns: minmax(0, 1fr) 180px 180px; gap: 10px; }
.filters-2 { grid-template-columns: minmax(0, 1fr) 180px; }
.hint { color: var(--color-text-muted); font-size: 13px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Blazor <ValidationMessage> + EditForm classes */
.validation-message { color: var(--color-danger); font-size: 13px; font-weight: 500; }
input.invalid, textarea.invalid, select.invalid { border-color: var(--color-danger); }
.alert { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--radius-button); font-size: 14px; font-weight: 500; }
.alert-error { background: var(--color-danger-light); color: var(--color-danger); border: 1px solid var(--color-danger-border); }

/* ---------- Auth page ---------- */
.auth { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; }
.auth .brand { padding: 0; font-size: 24px; }
.auth .brand img { height: 34px; }
.auth-card { width: 100%; max-width: 420px; padding: 8px 28px 28px; }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; margin: 0 -28px 20px; border-bottom: 1px solid var(--color-border); }
.auth-tabs a { padding: 14px 12px 12px; text-align: center; font-weight: 600; font-size: 15px; color: var(--color-text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.auth-tabs a.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }

/* ---------- Home banner (guests only) ---------- */
.hero { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 26px 28px; border-radius: var(--radius-card); background: var(--color-navy); color: #fff; }
.hero h2 { font-size: 28px; line-height: 1.2; font-weight: 700; }
.hero p { max-width: 460px; color: #CBD5E1; font-size: 15px; line-height: 1.55; }
.hero .row { margin-top: 6px; }

/* ---------- Article page ---------- */
.article h1 { margin: 10px 0 14px; font-size: 34px; line-height: 1.2; font-weight: 700; }
.article-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.article-meta small { display: block; color: var(--color-text-muted); font-size: 13px; }
.prose { margin: 24px 0; font-size: 16px; line-height: 1.7; white-space: pre-wrap; } /* plain textarea text keeps its paragraphs */
.crumbs { font-size: 14px; color: var(--color-text-muted); }
.crumbs a { color: var(--color-primary); }
.stars { display: inline-flex; gap: 2px; color: #F59E0B; }
.star-btn { background: none; border: 0; padding: 6px 3px; color: #F59E0B; line-height: 0; }
.rate-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; }

/* ---------- Comments (flat) ---------- */
.comment { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; }
.comment-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.comment-head .muted { margin-left: 2px; }
.comment-body { font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
.comment-actions { display: flex; gap: 16px; }

/* ---------- Empty states + account ---------- */
.empty { padding: 36px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty h3 { font-size: 17px; font-weight: 600; }
.empty p { color: var(--color-text-muted); font-size: 14px; max-width: 340px; }
.empty .btn { margin-top: 10px; }
.info-list { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; font-size: 15px; }
.info-list dt { color: var(--color-text-muted); font-size: 14px; }
.info-list dd { margin: 0; }
.danger-zone { border-color: var(--color-danger-border); }
.danger-zone h2 { font-size: 18px; font-weight: 600; }
.confirm { margin-top: 14px; padding: 16px; border-radius: var(--radius-button); background: var(--color-danger-light); border: 1px solid var(--color-danger-border); display: flex; flex-direction: column; gap: 12px; }

/* ==MOBILE-START==
   The ONLY responsive switch. One rule per line so the preview can scope it. */
@media (max-width: 768px) {
.app { grid-template-columns: 1fr; }
.sidebar { display: none; }
.topbar-m { display: flex; }
.tabbar { display: grid; }
.main { padding: 16px 16px 88px; }
.page-head h1 { font-size: 25px; }
.btn { min-height: 44px; }
.btn.btn-sm { min-height: 36px; }
.filters { grid-template-columns: 1fr 1fr; }
.filters-2 { grid-template-columns: 1fr; }
.filters .search { grid-column: 1 / -1; }
.board-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.board-card .band { height: 44px; }
.board-head h1 { font-size: 24px; }
.article h1 { font-size: 26px; }
.hero { padding: 20px; }
.hero h2 { font-size: 24px; }
.input-title { font-size: 24px; }
textarea.input { min-height: 260px; }
textarea.input.input-sm { min-height: 88px; }
.auth-card { padding: 4px 20px 24px; }
.auth-tabs { margin: 0 -20px 18px; }
.info-list { grid-template-columns: 1fr; gap: 2px; }
}
/* ==MOBILE-END== */

@media (prefers-reduced-motion: no-preference) {
  .btn, .nav-item, .article-card, .board-card { transition: background-color .15s, border-color .15s, color .15s; }
}
</script>

const SPEC=[["Layout","Desktop: 232px sidebar. Mobile (≤ 768px): top bar + 4-tab bar with a round Write button. One media query."],["Components (6)","AppShell, ArticleCard, BoardCard, CommentList, FilterBar, FormField."],["Board colours","Class c0–c5 per board (c{board.Id % 6}). Blue, teal, purple, amber, rose, cyan. Green stays for Publish only."],["Fixes in the patch","⚠ icon on validation messages; taller touch targets for link buttons on mobile; larger breadcrumb target."],["Open decisions","Board description (needs one column) and “+ New board” (needs a one-field form, or seed boards in code)."],["Tokens","Unchanged from app.css and the style guide."]];
const SC=[["home","Home"],["boards","Boards"],["board","Board"],["article","Article"],["editor","Editor"],["auth","Sign in"],["account","Account"]];
function btns(id,items,key){const e=document.getElementById(id);e.innerHTML=items.map(i=>`<button aria-pressed="${S[key]===i[0]}" data-v="${i[0]}">${i[1]}</button>`).join("");e.onclick=ev=>{const v=ev.target.dataset.v;if(v){S[key]=v;draw()}}}
function draw(){btns("scr",SC,"scr");btns("dev",[["d","Desktop"],["m","Mobile"]],"dev");btns("who",[["out","Guest"],["in","Signed in"],["mod","Moderator"]],"who");
 const m=S.dev==="m",st=document.getElementById("stage"),n=N[S.scr],W=m?390:1100;
 const doc=`<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${CSS}${FIX}</style></head><body>${T[S.scr]()}</body></html>`;
 st.innerHTML=`<p class="cap" style="padding:0;margin:0 0 10px;width:${Math.min(W,st.clientWidth)}px"><b>${n[0]}.</b> ${n[1]}</p><div class="dev${m?" m":""}" id="dv" style="width:${W}px"><iframe title="${n[0]}" id="fr" style="height:760px"></iframe></div>`;
 const f=document.getElementById("fr");f.srcdoc=doc;
 f.onload=()=>{const d=f.contentDocument;d.addEventListener("click",e=>{const x=e.target.closest("[data-tab]");if(x){S.tab=x.dataset.tab;draw()}});f.style.height=Math.max(m?700:560,d.documentElement.scrollHeight)+"px"};
 const z=Math.min(1,(st.clientWidth-8)/(W+(m?16:2)));document.getElementById("dv").style.zoom=z}
document.getElementById("spec").innerHTML=SPEC.map(s=>`<div><h2>${s[0]}</h2><p>${s[1]}</p></div>`).join("");
addEventListener("resize",draw);draw();
</script></body></html>
